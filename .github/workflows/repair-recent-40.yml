name: Repair Recent Pinterest Image Set

on:
  workflow_dispatch:
  repository_dispatch:
    types: [repair_recent_pinterest_images]

permissions:
  contents: read
  id-token: write

concurrency:
  group: repair-recent-pinterest-images
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Request GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 3 --retry-all-errors             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             -H 'Accept: application/json; api-version=2.0'             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fgithub.com%2FNdarwin-hub%2Fpinterest-autonomous-agent")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          echo "ID_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Retry only unfinished target Pin indexes
        shell: bash
        run: |
          set -euo pipefail
          payload='{
            "items":[
              {"url":"https://www.amazon.com/SenCre-Nugget-Countertop-Makers-Chewable/dp/B0HF4QN93Z?tag=desiredplus-20","retry_pin_indices":[2,3,4],"target_board_id":"987906936951145744"},
              {"url":"https://www.amazon.com/HOW-SELL-AMAZON-BEGINNERS-Step/dp/B0GWPTMYZ9?tag=desiredplus-20","retry_pin_indices":[1,2,3,4],"target_board_id":"987906936951147704"},
              {"url":"https://www.amazon.com/Apple-iPhone-SE-64GB-White/dp/B088NQSLGN?tag=desiredplus-20","retry_pin_indices":[1,2,3,4],"target_board_id":"987906936951153891"},
              {"url":"https://www.amazon.com/Fresh-Step-Advanced-Multi-Cat-18-5lb/dp/B07ZK3FP27?tag=desiredplus-20","retry_pin_indices":[1,2,3,4],"target_board_id":"987906936951148021"},
              {"url":"https://www.amazon.com/msi-Katana-15-HX-i7-14650HX/dp/B0HGR2MWJV?tag=desiredplus-20","retry_pin_indices":[1,2,3,4],"target_board_id":"987906936951153890"},
              {"url":"https://www.amazon.com/Holder-Organizers-Pencil-Compartments-Organizer/dp/B0CQP9LYXC?tag=desiredplus-20","retry_pin_indices":[1,2,3,4],"target_board_id":"987906936951148020"}
            ]
          }'
          response=$(curl --fail --silent --show-error --no-buffer             --connect-timeout 20 --max-time 900             --retry 3 --retry-delay 5 --retry-all-errors             -H "Authorization: Bearer $ID_TOKEN"             -H 'Content-Type: application/json'             -H 'X-Pin-A-Source: repair-retry-unfinished'             -H "X-Pin-A-Request-ID: repair-retry-${GITHUB_RUN_ID}"             -X POST 'https://web-production-dae68.up.railway.app/repair-pins'             --data "$payload")
          printf '%s\n' "$response"
          accepted=$(printf '%s' "$response" | jq -r '.accepted // 0')
          test "$accepted" -eq 6
