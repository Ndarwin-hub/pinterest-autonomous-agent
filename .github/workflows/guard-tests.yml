name: Guard tests

on:
  pull_request:
    paths:
      - "publication_guard.py"
      - "image_diversity_guard.py"
      - "tests/**"
      - "main.py"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "publication_guard.py"
      - "image_diversity_guard.py"
      - "tests/**"
      - "main.py"
      - "requirements.txt"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile main.py publication_guard.py image_diversity_guard.py
      - run: PYTHONPATH=. pytest -q tests/test_publication_guard.py
