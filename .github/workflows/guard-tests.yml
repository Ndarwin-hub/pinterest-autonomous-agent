name: Guard tests
on:
  pull_request:
    paths:
      - "publication_guard.py"
      - "image_diversity_guard.py"
      - "image_quality.py"
      - "image_fingerprint.py"
      - "ai_quality_gate.py"
      - "wire_board_org.py"
      - "runtime_hardening.py"
      - "pin_config.py"
      - "daily_ledger.py"
      - "amazon_*.py"
      - "tests/**"
      - "main.py"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "publication_guard.py"
      - "image_diversity_guard.py"
      - "amazon_*.py"
      - "tests/**"
      - "main.py"
      - "requirements.txt"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile main.py agent.py wire_board_org.py runtime_hardening.py publication_guard.py image_diversity_guard.py image_quality.py image_fingerprint.py ai_quality_gate.py amazon_alerts.py amazon_watchdog.py amazon_composio_discovery.py amazon_discovery.py amazon_scheduler.py amazon_boards.py daily_ledger.py pin_supervisor.py
      - run: PYTHONPATH=. pytest -q tests
