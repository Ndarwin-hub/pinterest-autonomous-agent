name: Visual and architecture regression tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Execute 20-Pin repair on explicit repair commit
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$COMMIT_MESSAGE" != *"RUN-20-PIN-IMAGE-REPAIR-4"* ]]; then
            exit 0
          fi
          r=$(curl --fail --silent --show-error --retry 5 --retry-all-errors -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" -H "Accept: application/json; api-version=2.0" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fgithub.com%2FNdarwin-hub%2Fpinterest-autonomous-agent")
          token=$(printf '%s' "$r" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          payload='{"items":[{"url":"https://www.amazon.com/SenCre-Nugget-Countertop-Makers-Chewable/dp/B0HF4QN93Z?tag=desiredplus-20","pin_ids":["987906868284388979","987906868284388978"],"target_board_id":"987906936951145744","target_board_name":"Home, Kitchen & Dining"},{"url":"https://www.amazon.com/HOW-SELL-AMAZON-BEGINNERS-Step/dp/B0GWPTMYZ9?tag=desiredplus-20","pin_ids":["987906868284388973","987906868284388972","987906868284388971","987906868284388969"],"target_board_id":"987906936951147704","target_board_name":"Books & Learning"},{"url":"https://www.amazon.com/Apple-iPhone-SE-64GB-White/dp/B088NQSLGN?tag=desiredplus-20","pin_ids":["987906868284388410","987906868284388408"],"target_board_id":"987906936951153891","target_board_name":"Cell Phones & Accessories"},{"url":"https://www.amazon.com/Fresh-Step-Advanced-Multi-Cat-18-5lb/dp/B07ZK3FP27?tag=desiredplus-20","pin_ids":["987906868284388404","987906868284388403","987906868284388402","987906868284388401"],"target_board_id":"987906936951148021","target_board_name":"Pet Supplies"},{"url":"https://www.amazon.com/msi-Katana-15-HX-i7-14650HX/dp/B0HGR2MWJV?tag=desiredplus-20","pin_ids":["987906868284388397","987906868284388395","987906868284388394","987906868284388393"],"target_board_id":"987906936951153890","target_board_name":"Computers & Accessories"},{"url":"https://www.amazon.com/Holder-Organizers-Pencil-Compartments-Organizer/dp/B0CQP9LYXC?tag=desiredplus-20","pin_ids":["987906868284388379","987906868284388377","987906868284388375","987906868284388374"],"target_board_id":"987906936951148020","target_board_name":"Office & Productivity"}]}'
          response=$(curl --fail --silent --show-error --no-buffer --connect-timeout 20 --max-time 1500 --retry 5 --retry-delay 10 --retry-all-errors -H "Authorization: Bearer $token" -H "Content-Type: application/json" -H "X-Pin-A-Source: repair-20-regression4" -H "X-Pin-A-Request-ID: repair-20-${GITHUB_RUN_ID}" -X POST "https://web-production-dae68.up.railway.app/repair-pins" --data "$payload")
          printf '%s
' "$response"
          test "$(printf '%s' "$response" | jq -r '.accepted // 0')" -eq 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile main.py agent.py wire_board_org.py runtime_hardening.py publication_guard.py image_diversity_guard.py image_quality.py image_fingerprint.py ai_quality_gate.py amazon_alerts.py amazon_watchdog.py amazon_composio_discovery.py amazon_discovery.py amazon_scheduler.py amazon_boards.py daily_ledger.py pin_supervisor.py
      - run: PYTHONPATH=. pytest -q tests
