name: Deploy Cloudflare Amazon Wake Watchdog

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/desiredplus-amazon-wake-watchdog/**"
      - ".github/workflows/deploy-cloudflare-watchdog.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/desiredplus-amazon-wake-watchdog
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Deploy Worker using temporary Cloudflare account
        run: |
          npx wrangler deploy --temporary

      - name: Deployment note
        run: |
          echo "Temporary deployment created. Wrangler prints a claim URL in the deployment log."
          echo "The temporary Cloudflare account must be claimed within 60 minutes."
