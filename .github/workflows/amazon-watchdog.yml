name: Amazon schedule watchdog
on:
  schedule:
    - cron: '10 7 * * *'
      timezone: 'America/New_York'
    - cron: '50 8 * * *'
      timezone: 'America/New_York'
    - cron: '30 10 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch to verify/recover'
        required: true
        type: choice
        options: ['1','2','3']
permissions:
  contents: read
  id-token: write
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Select expected batch
        id: select
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "batch=${{ inputs.batch }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "10 7 * * *" ]]; then
            echo "batch=1" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "50 8 * * *" ]]; then
            echo "batch=2" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "30 10 * * *" ]]; then
            echo "batch=3" >> "$GITHUB_OUTPUT"
          else
            echo 'Unknown schedule' >&2; exit 1
          fi
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H 'Accept: application/json; api-version=2.0' \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fgithub.com%2FNdarwin-hub%2Fpinterest-autonomous-agent")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Verify or recover expected batch
        env:
          ID_TOKEN: ${{ steps.oidc.outputs.token }}
          BATCH: ${{ steps.select.outputs.batch }}
        shell: bash
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error --no-buffer \
            --connect-timeout 20 --max-time 2400 \
            --retry 5 --retry-delay 10 --retry-max-time 120 --retry-all-errors \
            -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' \
            -X POST 'https://web-production-dae68.up.railway.app/amazon/run-batch' \
            --data "{\"batch\":$BATCH}" | tee "$response_file"
          final_status=$(awk 'NF { last=$0 } END { if (last != "") print last }' "$response_file" | jq -r '.status // empty')
          case "$final_status" in
            completed|running)
              echo "Watchdog status: $final_status"
              ;;
            failed|partial_failure|blocked|busy|dormant)
              echo "Watchdog detected unhealthy batch status: $final_status" >&2
              exit 1
              ;;
            *)
              echo "Unknown or missing watchdog status: ${final_status:-<empty>}" >&2
              exit 1
              ;;
          esac
