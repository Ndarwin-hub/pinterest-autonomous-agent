name: Pin A Universal Trigger

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Calling source identifier (informational only; no fixed source list)"
        required: false
        default: "manual"
        type: string
      request_id:
        description: "Optional caller-supplied idempotency/correlation ID"
        required: false
        default: ""
        type: string
permissions:
  contents: read
  id-token: write

concurrency:
  group: pin-a-universal-trigger
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H 'Accept: application/json; api-version=2.0' \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fgithub.com%2FNdarwin-hub%2Fpinterest-autonomous-agent")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          echo "ID_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Call Pin A contract
        shell: bash
        run: |
          set -euo pipefail

          source=$(jq -r '.inputs.source // .client_payload.source // "github"' "$GITHUB_EVENT_PATH")
          request_id=$(jq -r '.inputs.request_id // .client_payload.request_id // empty' "$GITHUB_EVENT_PATH")
          if [[ -z "$request_id" ]]; then request_id="$GITHUB_RUN_ID"; fi

          response=$(curl --fail --silent --show-error --no-buffer \
            --connect-timeout 20 --max-time 120 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $ID_TOKEN" \
            -H 'Content-Type: application/json' \
            -H "X-Pin-A-Source: $source" \
            -H "X-Pin-A-Request-ID: $request_id" \
            -H "X-Pin-A-GitHub-Run-ID: $GITHUB_RUN_ID" \
            -H "X-Pin-A-Event: $GITHUB_EVENT_NAME" \
            -X POST 'https://web-production-dae68.up.railway.app/pin-a' \
            --data "{\"batch\":1,\"scheduler_run_id\":\"pin-a:$request_id\",\"scheduled_local_time\":\"pin-a\",\"github_delay_seconds\":0,\"github_queued_runs\":0,\"github_active_runs\":0,\"github_load_class\":\"PIN_A\"}")

          printf '%s\n' "$response"
          status=$(printf '%s' "$response" | jq -r '.status // empty')
          case "$status" in
            session_started|already_running|already_completed|ignored)
              echo "Pin A accepted by Railway: $status"
              ;;
            *)
              echo "Pin A returned unexpected status: ${status:-<empty>}" >&2
              exit 1
              ;;
          esac
