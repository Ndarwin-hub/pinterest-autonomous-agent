name: Kaggle Video Primary

on:
  schedule:
    - cron: '26 1 * * *'
    - cron: '02 3 * * *'
    - cron: '38 4 * * *'
    - cron: '14 6 * * *'
    - cron: '50 7 * * *'
  workflow_dispatch:
    inputs:
      pair_start:
        description: 'Pinterest batch pair start (1,3,5,7,9)'
        required: true
        type: choice
        options: ['1','3','5','7','9']
      dry_run:
        description: 'Check Drive queue and connected social accounts without publishing videos'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: desiredplus-kaggle-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_VIDEO_KERNEL_ID: ndarwin1414/amazon-productvideo-renderer-test
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGEL_API_TOKEN }}
      DRIVE_STATE_FILE_ID: 1Qf-Ccn5aiyRo-tdgJxj5x0UhmYCVrEQb
    steps:
      - name: Checkout video engine
        uses: actions/checkout@v4
      - name: Compile video production runner
        run: python -m py_compile kaggle_video_primary.py
      - name: Run migration contract tests
        run: python -m unittest discover -s tests -p "test_kaggle_migration_contract.py"

      - name: Resolve pair
        id: pair
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            start="${{ inputs.pair_start }}"
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then dry_run=true; else dry_run=false; fi
          else
            case "${{ github.event.schedule }}" in
              '26 1 * * *') start=1 ;;
              '02 3 * * *') start=3 ;;
              '38 4 * * *') start=5 ;;
              '14 6 * * *') start=7 ;;
              '50 7 * * *') start=9 ;;
              *) echo "Unknown video pair schedule" >&2; exit 1 ;;
            esac
            dry_run=false
          fi
          day="$(TZ=Asia/Kathmandu date +%F)"
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "run_id=kaggle-$day-pair-$start-gh${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Validate Kaggle API credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "KAGGLE_API_TOKEN/KAGGEL_API_TOKEN repository secret is missing"; exit 1; }
          echo "::add-mask::$KAGGLE_API_TOKEN"

      - name: Install Kaggle CLI and notebook tooling
        run: |
          python -m pip install --upgrade kaggle nbformat
          kaggle --version

      - name: Pull video kernel template
        run: |
          set -euo pipefail
          rm -rf /tmp/kaggle-video && mkdir -p /tmp/kaggle-video
          kaggle kernels pull "$KAGGLE_VIDEO_KERNEL_ID" -p /tmp/kaggle-video -m
          test -f /tmp/kaggle-video/kernel-metadata.json

      - name: Install Railway-independent video runner
        env:
          PAIR_START: ${{ steps.pair.outputs.start }}
          RUN_ID: ${{ steps.pair.outputs.run_id }}
          VIDEO_DRY_RUN: ${{ steps.pair.outputs.dry_run }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, textwrap
          from pathlib import Path
          import nbformat

          root=Path("/tmp/kaggle-video")
          metadata_path=root/"kernel-metadata.json"
          metadata=json.loads(metadata_path.read_text())
          notebooks=list(root.glob("*.ipynb"))
          if not notebooks: raise SystemExit("No Kaggle video notebook found")
          notebook_path=notebooks[0]
          pair=int(os.environ["PAIR_START"])
          run_id=os.environ["RUN_ID"]
          dry_run=os.environ["VIDEO_DRY_RUN"].lower()=="true"
          drive_id=os.environ["DRIVE_STATE_FILE_ID"]
          sha=os.environ["SOURCE_SHA"]
          config=textwrap.dedent(f'''
          import os
          os.environ["KAGGLE_VIDEO_PAIR_START"]="{pair}"
          os.environ["KAGGLE_VIDEO_RUN_ID"]={run_id!r}
          os.environ["KAGGLE_VIDEO_DRY_RUN"]="{str(dry_run).lower()}"
          os.environ["DRIVE_STATE_FILE_ID"]="{drive_id}"
          ''').lstrip()
          bootstrap=textwrap.dedent(f'''
          import os, subprocess, sys
          REPO="/kaggle/working/pinterest-autonomous-agent"
          if not os.path.isdir(REPO):
              subprocess.run(["git","clone","https://github.com/Ndarwin-hub/pinterest-autonomous-agent.git",REPO],check=True)
          subprocess.run(["git","-C",REPO,"fetch","origin","{sha}"],check=True)
          subprocess.run(["git","-C",REPO,"checkout","--force","{sha}"],check=True)
          os.chdir(REPO)
          subprocess.run([sys.executable,"-m","pip","install","-r","requirements.txt"],check=True)
          subprocess.run([sys.executable,"-m","py_compile","kaggle_video_primary.py"],check=True)
          exec(compile(open("kaggle_video_primary.py",encoding="utf-8").read(),"kaggle_video_primary.py","exec"),{{"__name__":"__main__"}})
          ''').lstrip()
          nb=nbformat.v4.new_notebook()
          nb.cells=[nbformat.v4.new_code_cell(config),nbformat.v4.new_code_cell(bootstrap)]
          nb.metadata=metadata.get("metadata",{})
          nbformat.write(nb,notebook_path)
          print(f"Prepared video pair={pair}, dry_run={dry_run}, source={sha}")
          PY

      - name: Push and execute Kaggle video kernel
        run: kaggle kernels push -p /tmp/kaggle-video

      - name: Wait for Kaggle completion
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS+4800))
          while (( SECONDS < deadline )); do
            status="$(kaggle kernels status "$KAGGLE_VIDEO_KERNEL_ID" 2>&1 || true)"
            echo "$status"
            upper="$(printf '%s' "$status" | tr '[:lower:]' '[:upper:]')"
            if grep -Eq '(^|[^A-Z])(COMPLETE|COMPLETED)([^A-Z]|$)' <<<"$upper"; then exit 0; fi
            if grep -Eq '(^|[^A-Z])(ERROR|FAILED|FAILURE)([^A-Z]|$)' <<<"$upper"; then
              echo "Kaggle video execution failed." >&2
              exit 1
            fi
            sleep 30
          done
          echo "Kaggle video kernel did not finish within 80 minutes." >&2
          exit 1

      - name: Collect Kaggle notebook diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/kaggle-video-output
          kaggle kernels output "$KAGGLE_VIDEO_KERNEL_ID" -p /tmp/kaggle-video-output || true
          python - <<'PY'
          from pathlib import Path
          import json
          for path in Path("/tmp/kaggle-video-output").glob("**/*"):
              if path.suffix.lower() == ".ipynb":
                  try:
                      nb=json.loads(path.read_text())
                      for idx,cell in enumerate(nb.get("cells",[]),1):
                          for out in cell.get("outputs",[]):
                              text=out.get("text") or out.get("data",{}).get("text/plain")
                              if text: print(f"NOTEBOOK_CELL_{idx}: {text}")
                              if out.get("ename"): print(f"NOTEBOOK_ERROR_{idx}: {out.get('ename')}: {out.get('evalue')}")
                  except Exception as exc:
                      print("DIAGNOSTIC_PARSE_ERROR",path,str(exc))
              elif path.is_file():
                  print("KAGGLE_OUTPUT_FILE",path.name,path.stat().st_size)
                  if path.suffix.lower() in (".json",".txt",".log"):
                      print(path.read_text(errors="replace")[:12000])
          PY

      - name: Confirm Railway-independent completion
        if: success()
        run: echo "Kaggle video pair ${{ steps.pair.outputs.start }} finished; state and publication results are stored in Google Drive."
