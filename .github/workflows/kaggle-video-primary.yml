name: Kaggle Video Primary

on:
  # Video-only path. This workflow does not call or modify the Pinterest scheduler.
  schedule:
    - cron: '11 1 * * *'  # 06:56 NPT -> pair 1+2
    - cron: '47 2 * * *'  # 08:32 NPT -> pair 3+4
    - cron: '23 4 * * *'  # 10:08 NPT -> pair 5+6
    - cron: '59 5 * * *'  # 11:44 NPT -> pair 7+8
    - cron: '35 7 * * *'  # 13:20 NPT -> pair 9+10
  workflow_dispatch:
    inputs:
      pair_start:
        description: 'Railway/Kaggle pair start (1,3,5,7,9)'
        required: true
        type: choice
        options: ['1','3','5','7','9']

permissions:
  contents: read

concurrency:
  group: kaggle-video-primary
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      KAGGLE_VIDEO_KERNEL_ID: ndarwin1414/amazon-productvideo-renderer-test
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Validate Kaggle credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KAGGLE_API_TOKEN:-}" ]]; then
            echo "KAGGLE_API_TOKEN is not configured in GitHub repository secrets."
            exit 2
          fi

      - name: Install Kaggle CLI and notebook tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade kaggle nbformat

      - name: Resolve pair and run identity
        id: pair
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            start="${{ inputs.pair_start }}"
          else
            case "${{ github.event.schedule }}" in
              '11 1 * * *') start=1 ;;
              '47 2 * * *') start=3 ;;
              '23 4 * * *') start=5 ;;
              '59 5 * * *') start=7 ;;
              '35 7 * * *') start=9 ;;
              *) echo "Unknown schedule: ${{ github.event.schedule }}" >&2; exit 1 ;;
            esac
          fi
          day="$(TZ=Asia/Kathmandu date +%F)"
          run_id="kaggle-${day}-pair-${start}-gh${{ github.run_id }}"
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "pair=${start}+$((start+1))" >> "$GITHUB_OUTPUT"

      - name: Pull the exact production Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kaggle-video
          mkdir -p /tmp/kaggle-video
          kaggle kernels pull "$KAGGLE_VIDEO_KERNEL_ID" -p /tmp/kaggle-video -m
          test -f /tmp/kaggle-video/kernel-metadata.json

      - name: Inject durable run context without changing the notebook logic
        shell: bash
        env:
          RUN_ID: ${{ steps.pair.outputs.run_id }}
          DAY: ${{ steps.pair.outputs.day }}
          PAIR_START: ${{ steps.pair.outputs.start }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import nbformat

          root = Path("/tmp/kaggle-video")
          notebooks = list(root.glob("*.ipynb"))
          if not notebooks:
              raise SystemExit("No .ipynb file returned by kaggle kernels pull")
          nb_path = notebooks[0]
          nb = nbformat.read(nb_path, as_version=4)

          bootstrap = nbformat.v4.new_code_cell(
              source=(
                  "import os\n"
                  f"os.environ['KAGGLE_VIDEO_RUN_ID'] = {json.dumps(os.environ['RUN_ID'])}\n"
                  f"os.environ['KAGGLE_VIDEO_DAY'] = {json.dumps(os.environ['DAY'])}\n"
                  f"os.environ['KAGGLE_VIDEO_PAIR_START'] = {json.dumps(os.environ['PAIR_START'])}\n"
                  "os.environ['KAGGLE_VIDEO_SOURCE'] = 'github-actions'\n"
              )
          )
          nb.cells.insert(0, bootstrap)
          nbformat.write(nb, nb_path)
          PY

      - name: Push the exact kernel as a new executable Kaggle version
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p /tmp/kaggle-video

      - name: Wait for the Kaggle execution result
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2400))
          while (( SECONDS < deadline )); do
            status="$(kaggle kernels status "$KAGGLE_VIDEO_KERNEL_ID" 2>&1 || true)"
            echo "$status"
            upper="$(printf '%s' "$status" | tr '[:lower:]' '[:upper:]')"
            if grep -Eq '(^|[^A-Z])(COMPLETE|COMPLETED)([^A-Z]|$)' <<<"$upper"; then
              echo "Kaggle video primary completed."
              exit 0
            fi
            if grep -Eq '(^|[^A-Z])(ERROR|FAILED|FAILURE)([^A-Z]|$)' <<<"$upper"; then
              echo "Kaggle video primary failed."
              exit 1
            fi
            sleep 30
          done
          echo "Kaggle video primary timed out waiting for completion."
          exit 1

      - name: Record completion context
        shell: bash
        run: |
          echo "Kaggle pair: ${{ steps.pair.outputs.pair }}"
          echo "Run ID: ${{ steps.pair.outputs.run_id }}"
          echo "Kernel: $KAGGLE_VIDEO_KERNEL_ID"
