name: Kaggle Video Primary

on:
  schedule:
    - cron: '15 0 * * *' # 06:00 Asia/Kathmandu (UTC+05:45)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-video-primary
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGEL_API_TOKEN }}
      KAGGLE_VIDEO_KERNEL_ID: ndarwin1414/amazon-productvideo-renderer-test
    steps:
      - name: Checkout video automation
        uses: actions/checkout@v4

      - name: Validate Kaggle credential
        run: |
          if [[ -z "${KAGGLE_API_TOKEN:-}" ]]; then
            echo "Missing repository secret KAGGEL_API_TOKEN" >&2
            exit 1
          fi
          echo "Kaggle credential is present (value not displayed)."

      - name: Install Kaggle CLI
        run: python3 -m pip install --upgrade kaggle nbformat

      - name: Pull current production notebook
        run: |
          set -euo pipefail
          rm -rf /tmp/kaggle-video
          mkdir -p /tmp/kaggle-video
          kaggle kernels pull "$KAGGLE_VIDEO_KERNEL_ID" -p /tmp/kaggle-video -m
          test -f /tmp/kaggle-video/kernel-metadata.json

      - name: Patch temporary WoopSocial media lifecycle
        run: python3 scripts/patch_kaggle_woop_temp_media.py --notebook-dir /tmp/kaggle-video

      - name: Push and execute Kaggle kernel
        run: kaggle kernels push -p /tmp/kaggle-video

      - name: Verify Kaggle execution started
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status="$(kaggle kernels status "$KAGGLE_VIDEO_KERNEL_ID" 2>&1 || true)"
            echo "$status"
            upper="$(printf '%s' "$status" | tr '[:lower:]' '[:upper:]')"
            if grep -Eq 'RUNNING|COMPLETE|COMPLETED' <<<"$upper"; then
              echo "Kaggle accepted the new version and execution started."
              exit 0
            fi
            if grep -Eq 'ERROR|FAILED|FAILURE' <<<"$upper"; then
              echo "Kaggle reported an execution failure." >&2
              exit 1
            fi
            sleep 20
          done
          echo "Kaggle did not report a running or completed state within 10 minutes." >&2
          exit 1
