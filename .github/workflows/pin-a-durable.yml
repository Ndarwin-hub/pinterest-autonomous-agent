name: Durable Pin A wake

on:
  repository_dispatch:
    types: [pin-a-now]
  workflow_dispatch:
    inputs:
      batch:
        description: "Wake Pin A; batch value is informational"
        required: false
        default: "1"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 3 --retry-all-errors             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             -H 'Accept: application/json; api-version=2.0'             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fgithub.com%2FNdarwin-hub%2Fpinterest-autonomous-agent")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Wake Railway durable Pin A
        env:
          ID_TOKEN: ${{ steps.oidc.outputs.token }}
          GH_RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          request_id="github-pin-a:$GH_RUN_ID"
          response=$(curl --fail --silent --show-error --no-buffer             --connect-timeout 20 --max-time 120             --retry 5 --retry-delay 5 --retry-all-errors             -H "Authorization: Bearer $ID_TOKEN"             -H 'Content-Type: application/json'             -H 'X-Pin-A-Source: github-pin-a-durable'             -H "X-Pin-A-Request-ID: $request_id"             -X POST 'https://web-production-dae68.up.railway.app/pin-a'             --data "{"source":"github-pin-a-durable","request_id":"$request_id"}")
          printf '%s\n' "$response"
          status=$(printf '%s' "$response" | jq -r '.status // empty')
          case "$status" in
            accepted|session_started|already_running|already_completed|ignored)
              echo "Durable Pin A wake accepted: $status"
              ;;
            *)
              echo "Durable Pin A wake failed: $status" >&2
              exit 1
              ;;
          esac
