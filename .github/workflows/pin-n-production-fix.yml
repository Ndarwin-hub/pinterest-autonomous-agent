name: Pin N Production Timeout Repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Reduce Pin N discovery latency without changing Pin A or /submit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("pin_n_discovery.py")
          s = p.read_text()
          old = '''PIN_N_BROAD_QUERIES = [
    "new Amazon products",
    "new releases Amazon",
    "new arrivals Amazon",
    "latest Amazon best sellers",
    "popular new products",
    "Amazon best sellers",
    "new useful products",
    "trending Amazon products",
]'''
          new = '''PIN_N_BROAD_QUERIES = [
    "new Amazon products",
    "new releases Amazon",
    "new arrivals Amazon",
    "Amazon best sellers",
]'''
          if old not in s:
              raise SystemExit("Pin N broad-query block not found; refusing unsafe edit")
          s = s.replace(old, new, 1)
          old2 = '''        for page in (1, 2, 3):'''
          new2 = '''        for page in (1,):'''
          if old2 not in s:
              raise SystemExit("Pin N page loop not found; refusing unsafe edit")
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
          python -m py_compile pin_n_discovery.py
          git diff --check
      - name: Commit and push repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pin_n_discovery.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: reduce Pin N discovery latency"
          git push origin HEAD:main
