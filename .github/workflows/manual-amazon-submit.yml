name: Manual Amazon affiliate submit
on:
  push:
    paths:
      - ".github/manual-amazon-submit.json"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: manual-amazon-submit
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H 'Accept: application/json; api-version=2.0' \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fgithub.com%2FNdarwin-hub%2Fpinterest-autonomous-agent")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Submit explicit affiliate URLs
        env:
          ID_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/manual-amazon-submit.json
          curl --silent --show-error --no-buffer \
            --connect-timeout 20 --max-time 2400 \
            --retry 5 --retry-delay 10 --retry-max-time 120 --retry-all-errors \
            --write-out '\nHTTP_STATUS:%{http_code}\n' \
            -H "Authorization: Bearer $ID_TOKEN" \
            -H 'Content-Type: application/json' \
            -X POST 'http://iriguchi.proxy.rlwy.net:32414/amazon/manual-submit' \
            --data-binary @.github/manual-amazon-submit.json | tee response.json
          cat response.json
          test "$(jq -r '.accepted' response.json)" -eq "$(jq -r '.requested' response.json)"
