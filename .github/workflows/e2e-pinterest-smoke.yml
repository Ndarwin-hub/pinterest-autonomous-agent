name: Kaggle Pinterest migration smoke test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Compile Kaggle runners
        run: python -m py_compile kaggle_pin_primary.py kaggle_video_primary.py

      - name: Verify Railway-independent migration contract
        run: python -m unittest discover -s tests -p "test_kaggle_migration_contract.py"

      - name: Run regression tests
        env:
          PYTHONPATH: .
        run: pytest -q tests
