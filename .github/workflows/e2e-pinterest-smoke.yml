name: Pinterest end-to-end smoke test
on:
  push:
  repository_dispatch:
    types: [pinterest_e2e_smoke]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Submit one verified Amazon US product to Railway
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            -H 'Content-Type: application/json' \
            -X POST 'https://web-production-dae68.up.railway.app/submit' \
            --data '{"url":"https://www.amazon.com/dp/B09QQ662C1?tag=desiredplus-20"}')
          echo "$response"
          job_id=$(printf '%s' "$response" | jq -r '.job_id')
          test -n "$job_id" && test "$job_id" != "null"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
      - name: Wait for five-pin completion
        env:
          JOB_ID: ${{ steps.submit.outputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            response=$(curl --fail --silent --show-error \
              "https://web-production-dae68.up.railway.app/status/$JOB_ID")
            echo "$response"
            status=$(printf '%s' "$response" | jq -r '.status')
            if [[ "$status" == "completed" ]]; then
              verified=$(printf '%s' "$response" | jq -r '.result.verified_pins // 0')
              published=$(printf '%s' "$response" | jq -r '.result.pins_published // 0')
              test "$verified" -ge 5
              test "$published" -ge 5
              exit 0
            fi
            if [[ "$status" == "failed" || "$status" == "completed_partial" ]]; then
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for five-pin completion" >&2
          exit 1
