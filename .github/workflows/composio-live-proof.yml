name: One-product Composio live proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/composio-live-proof.yml"

permissions:
  id-token: write
  contents: read

jobs:
  prove-composio-to-pinterest:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Railway deployment
        run: sleep 120

      - name: Call one-product Composio proof route
        env:
          RAILWAY_URL: https://pinterest-autonomous-agent-production.up.railway.app
          OIDC_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          OIDC_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          AUDIENCE: https://github.com/Ndarwin-hub/pinterest-autonomous-agent
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsSL \
            -H "Authorization: bearer $OIDC_TOKEN" \
            "$OIDC_URL&audience=$AUDIENCE" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          curl -fsS --retry 5 --retry-delay 10 --max-time 300 \
            -X POST "$RAILWAY_URL/amazon/composio-test" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -o response.json
          cat response.json
          python - <<'PY'
          import json
          d=json.load(open("response.json"))
          assert d.get("source") == "composio_amazon_balance", d
          job=d.get("job") or {}
          result=job.get("result") or {}
          assert result.get("pins_published", 0) >= 1, d
          print("COMPOSIO AMAZON -> RAILWAY -> PINTEREST PROOF PASSED")
          print("product:", d.get("product", {}).get("title") or d.get("product", {}).get("name"))
          print("pins_published:", result.get("pins_published"))
          for p in result.get("pins", []):
              print(p.get("pin_url"))
          PY
