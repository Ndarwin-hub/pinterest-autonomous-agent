name: Repair Pinterest Pin Image Set

on:
  workflow_dispatch:
    inputs:
      items_json:
        description: 'JSON object with items to replace; each item has url, pin_ids, target_board_id, target_board_name'
        required: true
        type: string
      request_label:
        description: 'Short repair label for traceability'
        required: false
        default: 'manual-image-replacement'
        type: string
  repository_dispatch:
    types: [repair_pinterest_images]

permissions:
  contents: read
  id-token: write

concurrency:
  group: repair-pinterest-images
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve repair payload
        shell: bash
        env:
          DISPATCH_ITEMS: ${{ github.event.client_payload.items_json }}
          DISPATCH_LABEL: ${{ github.event.client_payload.request_label }}
          MANUAL_ITEMS: ${{ inputs.items_json }}
          MANUAL_LABEL: ${{ inputs.request_label }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            ITEMS_JSON="$DISPATCH_ITEMS"
            REQUEST_LABEL="$DISPATCH_LABEL"
          else
            ITEMS_JSON="$MANUAL_ITEMS"
            REQUEST_LABEL="$MANUAL_LABEL"
          fi
          test -n "$ITEMS_JSON"
          test -n "$REQUEST_LABEL"
          printf '%s' "$ITEMS_JSON" | jq -e '
            (.items | type == "array") and
            (.items | length >= 1 and length <= 5) and
            all(.[]; (.url | type == "string") and (.pin_ids | type == "array" and length >= 1) and
              (.target_board_id | type == "string") and (.target_board_name | type == "string"))
          ' >/dev/null
          printf '%s' "$ITEMS_JSON" > /tmp/items.json
          printf '%s' "$REQUEST_LABEL" > /tmp/request_label
          echo "Repair payload validated."

      - name: Request GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 3 --retry-all-errors             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             -H 'Accept: application/json; api-version=2.0'             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fgithub.com%2FNdarwin-hub%2Fpinterest-autonomous-agent")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          echo "ID_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Delete old Pins and enqueue exact replacements
        shell: bash
        run: |
          set -euo pipefail
          ITEMS_JSON=$(cat /tmp/items.json)
          REQUEST_LABEL=$(cat /tmp/request_label)
          response=$(curl --fail --silent --show-error --no-buffer             --connect-timeout 20 --max-time 900             --retry 3 --retry-delay 5 --retry-all-errors             -H "Authorization: Bearer $ID_TOKEN"             -H 'Content-Type: application/json'             -H 'X-Pin-A-Source: repair-one-batch'             -H "X-Pin-A-Request-ID: repair-${GITHUB_RUN_ID}-${REQUEST_LABEL}"             -X POST 'https://web-production-dae68.up.railway.app/repair-pins'             --data "$ITEMS_JSON")
          printf '%s
' "$response"
          accepted=$(printf '%s' "$response" | jq -r '.accepted // 0')
          test "$accepted" -eq 1
