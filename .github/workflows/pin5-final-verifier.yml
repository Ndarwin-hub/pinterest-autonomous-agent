name: Pin 5 final verifier
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Request GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 3 --retry-all-errors -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" -H 'Accept: application/json; api-version=2.0' "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fgithub.com%2FNdarwin-hub%2Fpinterest-autonomous-agent")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          echo "ID_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Poll final Pin 5 jobs
        shell: bash
        run: |
          set -euo pipefail
          ids=(b514580d-2802-4b36-8e00-4f0695ce31b4 37593cae-9577-4329-b614-85e5ddedfbd6 5ae2befc-f41e-4a8f-95e4-317ad9477205 0db6253b-32fb-4577-acb6-5741f2d04a3d 446abc31-3d68-434c-ac7a-3acccbbbe4d1)
          for attempt in $(seq 1 180); do
            terminal=1
            echo "=== poll $attempt ==="
            for id in "${ids[@]}"; do
              status=$(curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors -H "Authorization: Bearer $ID_TOKEN" "https://web-production-dae68.up.railway.app/status/$id")
              echo "JOB $id"
              printf '%s\n' "$status" | jq .
              state=$(printf '%s' "$status" | jq -r '.status // "unknown"')
              if [[ "$state" != "completed" && "$state" != "failed" && "$state" != "error" ]]; then terminal=0; fi
            done
            if [[ "$terminal" == "1" ]]; then exit 0; fi
            sleep 10
          done
          exit 1
