name: Video A Fallback Recovery

on:
  workflow_dispatch:
    inputs:
      pair_start:
        description: "Pair start to recover (1,3,5,7,9)"
        required: true
        type: choice
        options: ["1","3","5","7","9"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: video-a-fallback-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAIR_START: ${{ inputs.pair_start }}
      RUN_ID: "fallback-${{ github.run_id }}"

    steps:
      - name: Request Railway OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 5 --retry-all-errors             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             -H 'Accept: application/json; api-version=2.0'             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fgithub.com%2FNdarwin-hub%2Fpinterest-autonomous-agent")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Reset the requested pair for a clean recovery attempt
        env:
          ID_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(python3 - <<'PY'
          import json, os
          print(json.dumps({"pair_start": int(os.environ["PAIR_START"])}))
          PY
          )
          response=$(curl --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors             -w '\nHTTP_STATUS:%{http_code}\n'             -H "Authorization: Bearer $ID_TOKEN"             -H 'Content-Type: application/json'             -X POST 'https://web-production-dae68.up.railway.app/video/pair-recovery'             -d "$body")
          echo "$response"
          status=$(printf '%s' "$response" | sed -n 's/^HTTP_STATUS://p' | tail -1)
          [[ "$status" == "200" ]]

      - name: Request Railway to take ownership of the failed Kaggle pair
        env:
          ID_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "pair_start": int(os.environ["PAIR_START"]),
              "run_id": os.environ["RUN_ID"],
              "status": "FAILED",
              "error": "Kaggle primary unavailable; deterministic fallback takeover"
          }))
          PY
          )
          echo "Requesting fallback for pair $PAIR_START"
          response=$(curl --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors             -w '\nHTTP_STATUS:%{http_code}\n'             -H "Authorization: Bearer $ID_TOKEN"             -H 'Content-Type: application/json'             -X POST 'https://web-production-dae68.up.railway.app/video/github-checkpoint'             -d "$body")
          echo "$response"
          status=$(printf '%s' "$response" | sed -n 's/^HTTP_STATUS://p' | tail -1)
          if [[ "$status" != "200" ]]; then
            echo "Fallback takeover failed with HTTP $status"
            exit 1
          fi

      - name: Monitor Railway fallback
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..90}; do
            response=$(curl --fail --silent --show-error https://web-production-dae68.up.railway.app/video/fallback/status)
            echo "$response"
            if printf '%s' "$response" | grep -q '"status":"idle"'; then
              echo "Fallback worker is idle; checking durable pair state."
              exit 0
            fi
            sleep 30
          done
          echo "Fallback did not settle within 45 minutes."
          exit 1
