name: Repair Pin 2 Products

on:
  push:
    paths:
      - ".github/pin2-repair-trigger"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H 'Accept: application/json; api-version=2.0' \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fgithub.com%2FNdarwin-hub%2Fpinterest-autonomous-agent")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          echo "ID_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Repair the two failed Pin 2 products
        shell: bash
        run: |
          set -euo pipefail
          payload=$(cat <<'JSON'
          {
            "items": [
              {
                "url": "https://www.amazon.com/Amazon-Echo-Show-11-Vibrant-Full-HD-11-display-Graphite-Amazon/dp/B0DC91H3JK?tag=desiredplus-20",
                "retry_pin_indices": [1,2,3,4]
              },
              {
                "url": "https://www.amazon.com/Amazon-Fire-TV-Stick-HD-Thin-and-Portable/dp/B0DJGDC3BD?tag=desiredplus-20",
                "retry_pin_indices": [1,2,3,4]
              }
            ]
          }
          JSON
          )
          response=$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 60 \
            -H "Authorization: Bearer $ID_TOKEN" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -X POST "https://web-production-dae68.up.railway.app/repair-pins" \
            --data "$payload")
          printf '%s\n' "$response" | jq .
          accepted=$(printf '%s' "$response" | jq -r '.accepted // 0')
          test "$accepted" -eq 2
          jobs=$(printf '%s' "$response" | jq -r '[.results[] | select(.job_id) | .job_id] | join(",")')
          test -n "$jobs"
          echo "JOB_IDS=$jobs" >> "$GITHUB_ENV"

      - name: Verify all repaired Pins
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a job_ids <<< "$JOB_IDS"
          test "${#job_ids[@]}" -eq 2
          for attempt in $(seq 1 180); do
            all_done=true
            all_complete=true
            echo "=== repair verification attempt $attempt ==="
            for job_id in "${job_ids[@]}"; do
              status=$(curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
                -H "Authorization: Bearer $ID_TOKEN" \
                -G "https://web-production-dae68.up.railway.app/status/$job_id")
              printf '%s\n' "$status" | jq .
              state=$(printf '%s' "$status" | jq -r '.status // "unknown"')
              if [[ "$state" != "completed" && "$state" != "completed_partial" && "$state" != "failed" ]]; then
                all_done=false
              fi
              if [[ "$state" != "completed" ]]; then
                all_complete=false
              fi
            done
            if [[ "$all_done" == true ]]; then
              if [[ "$all_complete" == true ]]; then
                echo "PIN_2_REPAIR_SUCCESS"
                exit 0
              fi
              echo "PIN_2_REPAIR_FAILED" >&2
              exit 1
            fi
            sleep 10
          done
          echo "PIN_2_REPAIR_TIMEOUT" >&2
          exit 1
