name: Pin N Production Latency Repair
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Pin N discovery latency
        run: |
          python -c 'from pathlib import Path; p=Path("pin_n_discovery.py"); s=p.read_text(); old="""PIN_N_BROAD_QUERIES = [
    "new Amazon products",
    "new releases Amazon",
    "new arrivals Amazon",
    "latest Amazon best sellers",
    "popular new products",
    "Amazon best sellers",
    "new useful products",
    "trending Amazon products",
]"""; new="""PIN_N_BROAD_QUERIES = [
    "new Amazon products",
    "new releases Amazon",
    "new arrivals Amazon",
    "Amazon best sellers",
]"""; assert old in s; s=s.replace(old,new,1); assert "for page in (1, 2, 3):" in s; s=s.replace("for page in (1, 2, 3):","for page in (1,)",1); p.write_text(s)'
          python -m py_compile pin_n_discovery.py
          git diff --check
      - name: Commit repaired code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pin_n_discovery.py
          git diff --cached --quiet || git commit -m "fix: reduce Pin N discovery latency"
          git push origin HEAD:main
