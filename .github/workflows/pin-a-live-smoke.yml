name: Pin A live smoke test
on:
  push:
    paths:
      - README.md
permissions:
  id-token: write
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 3 --retry-all-errors             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             -H 'Accept: application/json; api-version=2.0'             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fgithub.com%2FNdarwin-hub%2Fpinterest-autonomous-agent")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Trigger Pin A
        env:
          ID_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --no-buffer             --connect-timeout 20 --max-time 180             --retry 3 --retry-delay 5 --retry-all-errors             -H "Authorization: Bearer $ID_TOKEN"             -H 'Content-Type: application/json'             -H 'X-Pin-A-Source: live-smoke-test'             -H "X-Pin-A-Request-ID: live-smoke:${{ github.run_id }}"             -X POST 'https://web-production-dae68.up.railway.app/pin-a'             --data '{"source":"live-smoke-test","request_id":"live-smoke:${{ github.run_id }}"}')
          printf '%s
' "$response"
          status=$(printf '%s' "$response" | jq -r '.status // empty')
          case "$status" in
            session_started|already_running|already_completed|ignored) exit 0 ;;
            *) exit 1 ;;
          esac

# trigger smoke execution after workflow registration
